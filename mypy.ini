# mypy.ini
[mypy]
python_version = 3.10
warn_unused_ignores = True

# Third-party packages that aren’t installed in CI’s 3.10/3.11 jobs.
[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-gspread.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-gspread_dataframe.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

# If your code imports typing_extensions on 3.10
[mypy-typing_extensions.*]
ignore_missing_imports = True
